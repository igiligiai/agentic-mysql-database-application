[project]
name = "agentic-mysql-database-application"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.3.0",
    "mysql-connector-python>=9.0.0",
    "openai>=1.76.0",
    "python-dotenv>=1.0.1",
    "sqlglot>=26.0.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = [
    "eval: slow end-to-end agent evaluation; needs OPENAI_API_KEY and a live MySQL database",
]
