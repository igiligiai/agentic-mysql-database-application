- question: Which makes have the most listings?
  sql: SELECT make, COUNT(*) AS listings FROM cars_silver GROUP BY make ORDER BY listings DESC LIMIT 10
  note: Count from silver, not bronze, so raw/duplicate rows do not inflate counts.

- question: What is the average price by make?
  sql: SELECT make, avg_price FROM vw_price_summary ORDER BY avg_price DESC
  note: vw_price_summary already aggregates price_usd by make; prefer it over re-deriving from silver.

- question: Which brand country makes the most expensive cars on average?
  sql: SELECT brand_country, AVG(price_usd) AS avg_price FROM vw_cars_gold GROUP BY brand_country ORDER BY avg_price DESC
  note: Exercises the brand join (cars_silver + brands) baked into vw_cars_gold.

- question: Show the ten most recently cleaned listings.
  sql: SELECT car_id, make, model, price_usd FROM cars_silver ORDER BY cleaned_at DESC LIMIT 10
  note: Order explicitly; MySQL does not guarantee row order. cleaned_at exists only in silver.

- question: Which cleaned listings are missing a mileage value?
  sql: SELECT car_id, make, model FROM cars_silver WHERE mileage_km IS NULL
  note: Prefer check_data_quality for a full null profile of a table.
