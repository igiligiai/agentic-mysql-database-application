- term: bronze layer
  definition: Raw ingested car listings, as loaded, with no cleaning applied.
  tables: [cars_bronze]
  note: Avoid reporting from bronze; price/mileage are untyped there.

- term: silver layer
  definition: Cleaned, typed car records with brand keys, safe to join/aggregate.
  tables: [cars_silver, brands]
  note: Correct starting point for most analytical questions.

- term: gold layer
  definition: Business-ready views, pre-joined/aggregated, used for reporting.
  tables: [vw_cars_gold, vw_price_summary]
  note: Views built from silver; never joined directly to bronze.

- term: listing
  definition: One row for a single vehicle, raw in bronze or cleaned in silver.
  tables: [cars_bronze, cars_silver]

- term: layer
  definition: The bronze/silver/gold stage a table or view belongs to.
  note: Use get_table_lineage to see data flow between layers.
